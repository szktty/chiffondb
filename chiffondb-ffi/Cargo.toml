[package]
name = "chiffondb-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false
description = "FFI layer for ChiffonDB — generated by flutter_rust_bridge, loaded by the Dart `chiffondb` package."

[lib]
name = "chiffondb_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
chiffondb-core = { path = "../chiffondb-core" }
flutter_rust_bridge = "=2.12.0"
serde_json = "1"
