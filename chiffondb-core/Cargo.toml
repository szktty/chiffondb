[package]
name = "chiffondb-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"
description = "Core storage, schema, and traversal engine for ChiffonDB — a lightweight embedded property graph database written in pure Rust."

[package.metadata.docs.rs]
no-deps = true

[lib]
name = "chiffondb_core"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pest = "2"
pest_derive = "2"
rmp-serde = "1"
regex = "1"
decypher = "=0.2.0-alpha.6"

[dev-dependencies]
proptest = "1"
tempfile = "3"
