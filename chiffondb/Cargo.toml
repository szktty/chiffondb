[package]
name = "chiffondb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../README.md"
description = "ChiffonDB — a lightweight embedded property graph database written in pure Rust."

[package.metadata.docs.rs]
no-deps = true

[lib]
name = "chiffondb"
path = "src/lib.rs"

[[bin]]
name = "chiffon"
path = "src/main.rs"

[dependencies]
chiffondb-core = { path = "../chiffondb-core", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
anyhow = "1"
csv = "1"

[dev-dependencies]
tempfile = "3"
